<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopCart - Products</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="nav-logo">ShopCart</h1>
            <div class="nav-links">
                <span id="userEmail"></span>
                <a href="cart.html" class="nav-link">Cart <span id="cartCount" class="cart-badge">0</span></a>
                <button id="logoutBtn" class="btn btn-small">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container products-container">
        <h2>Our Products</h2>
        <div class="categories-filter">
            <button class="filter-btn active" data-category="all">All</button>
            <button class="filter-btn" data-category="electronics">Electronics</button>
            <button class="filter-btn" data-category="fashion">Fashion</button>
            <button class="filter-btn" data-category="books">Books</button>
        </div>
        <div class="products-grid" id="productsGrid">
            <!-- Products will be loaded here -->
        </div>
    </div>

    <script src="js/products.js"></script>
</body>
</html>
